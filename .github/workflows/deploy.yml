name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  S3_BUCKET: claude-code-demo-app
  CLOUDFRONT_DISTRIBUTION_ID: EJRV6ZWO3SKLC

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::850122838169:role/github-actions-deploy-claude-demo
          aws-region: ${{ env.AWS_REGION }}
      - run: aws s3 sync build/ s3://${{ env.S3_BUCKET }} --delete
      - run: aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
